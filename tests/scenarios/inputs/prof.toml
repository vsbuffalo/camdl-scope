# Base config for profiles over beta or gamma (N0 fixed): two starts per cell.
[model]
camdl = "sir.camdl"

[data.observations]
cases = "cases.tsv"

[estimate]
beta = { bounds = [0.5, 1.5] }
gamma = { bounds = [0.1, 0.6] }

[fixed]
N0 = 10000


[method]
algorithm = "nl-sbplx"
backend = "ode"
chains = 2
starts = "lhs"
tolerance = 1e-8
max_evals = 2000
