[project]
name = "camdl-watch"
version = "0.1.0"
description = "Browser-based results viewer and live diagnostics for camdl fits"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arviz>=0.18",
    "polars>=1.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pygments>=2.20.0",
    "defopt>=6.4",
    "fastapi>=0.138.1",
    "uvicorn[standard]>=0.49.0",
]

[project.scripts]
camdl-watch = "camdl_watch.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["camdl_watch"]

# Ships the Vite bundle as package data (camdl_watch/_web); builds it first when
# absent, since `web/dist` is a gitignored build artifact and a wheel without it
# serves the API but 404s at `/`. See hatch_build.py.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# The sdist must carry the frontend SOURCES so the wheel build can produce the
# bundle; node_modules/dist stay excluded (gitignored build artifacts).
[tool.hatch.build.targets.sdist]
include = ["camdl_watch", "web", "hatch_build.py", "README.md", "Makefile", "tests"]
exclude = ["web/node_modules", "web/dist", "web/dist-demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
